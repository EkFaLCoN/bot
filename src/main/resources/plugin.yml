name: QATest
version: '${version}'
main: com.mrwqlf.qatest.QATest
api-version: '1.21.11'
author: MRWQLF
description: Ozel silah ve datapack esyalarini otomatik test edip acik arayan QA botu
folia-supported: false

commands:
  qatest:
    description: Otomatik test botunu calistirir
    usage: /qatest <calistir|liste|rapor|dur> [grup]
    aliases: [qa, test]

permissions:
  qatest.kullan:
    description: QA testlerini calistirabilme
    default: op
