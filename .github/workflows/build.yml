name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: gradle build --no-daemon

      - name: Jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: QATest
          path: build/libs/*.jar
