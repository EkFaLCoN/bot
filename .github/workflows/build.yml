name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ne var
        run: ls -la

      - name: Zipi ac
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            echo "aciliyor: $z"
            unzip -o "$z"
          done
          echo "--- build dosyasi nerede ---"
          find . -name 'build.gradle.kts' -o -name pom.xml | grep -v '/.git/' || echo "YOK"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derle
        run: |
          G=$(find . -name 'build.gradle.kts' -not -path './.git/*' | head -1)
          if [ -z "$G" ]; then echo "build.gradle.kts bulunamadi"; exit 1; fi
          cd "$(dirname "$G")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QATest
          path: '**/build/libs/*.jar'
